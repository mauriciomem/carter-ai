name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"

      - name: Install locked deps (with dev extra)
        run: uv sync --locked --extra dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked deps (with dev extra)
        run: uv sync --locked --extra dev

      - name: Run unit tests
        run: uv run pytest tests/ -q

      - name: Run offline evals
        # Offline only — the implementer-adherence replay (test_adherence.py) grades a
        # RECORDED Sonnet 4.6 transcript fixture deterministically, so the per-PR gate
        # never hits the billed API. The LIVE adherence run is the weekly evals-live
        # cron (carries the `live` marker, excluded by -m "not live").
        run: uv run pytest evals/ -m "not live" -q

  install-smoke:
    # `floor` = minimum supported OpenCode (required). `latest` = newest 2.x
    # (informational; allowed to fail so upstream drift doesn't block PRs).
    name: install-smoke (${{ matrix.os }}, opencode ${{ matrix.label }} ${{ matrix.opencode }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        label: [floor, latest]
        include:
          # Bump the OpenCode floor HERE (keep in sync with carter's minimum version gate).
          - label: floor
            opencode: "2.1.0"
            experimental: false
          - label: latest
            opencode: "2" # npm range: newest published 2.x
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs needs full history + tags to derive the version

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Install OpenCode ${{ matrix.opencode }} (npm, official V2 method)
        run: |
          npm install -g "@opencode/cli@${{ matrix.opencode }}"
          opencode --version

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install carter as a real uv tool
        run: |
          uv tool install .
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: carter --version (PEP 440)
        run: |
          carter --version
          python3 - <<'PY'
          import re, subprocess
          out = subprocess.check_output(["carter", "--version"], text=True).strip()
          ver = out.rsplit(" ", 1)[-1]
          assert re.match(
              r"^(\d+!)?\d+(\.\d+)*((a|b|rc)\d+)?(\.post\d+)?(\.dev\d+)?(\+[a-z0-9.]+)?$",
              ver, re.I,
          ), f"not PEP 440: {ver!r}"
          print("version OK:", ver)
          PY

      - name: carter init + check (fresh workspace)
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-ws"
          carter init "$RUNNER_TEMP/smoke-ws"
          carter check "$RUNNER_TEMP/smoke-ws"

      - name: carter install (throwaway home) + assert files
        run: |
          carter install --base-dir "$RUNNER_TEMP/fake-home"
          count=$(find "$RUNNER_TEMP/fake-home/opencode/agents" -maxdepth 1 -name '*.md' 2>/dev/null | wc -l)
          echo "opencode agents: $count"
          test "$count" -ge 8 || { echo "::error::expected >=8 opencode agent files"; exit 1; }
          test ! -e "$RUNNER_TEMP/fake-home/copilot" || { echo "::error::wrote to copilot"; exit 1; }
