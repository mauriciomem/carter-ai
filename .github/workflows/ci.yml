name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"

      - name: Create venv and install (with dev deps)
        run: |
          uv venv --clear
          uv pip install -e ".[dev]"

      - name: ruff check
        run: |
          source .venv/bin/activate
          ruff check .

      - name: ruff format --check
        run: |
          source .venv/bin/activate
          ruff format --check .

      - name: mypy
        run: |
          source .venv/bin/activate
          mypy

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create venv and install (with dev deps)
        run: |
          uv venv --clear
          uv pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -q

      - name: Run offline evals
        run: |
          source .venv/bin/activate
          python -m pytest evals/test_skills.py evals/test_routing.py -q
