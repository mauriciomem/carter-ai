name: release

# Automated SemVer release and publish pipeline, in ONE workflow: a tag pushed with
# GITHUB_TOKEN does not trigger other workflows, so the build and the publish must live here.
#
#   release -> build -> publish-testpypi -> publish-pypi
#
# release: on every push to main, python-semantic-release inspects the Conventional Commits
#   since the last `vX.Y.Z` tag, derives the bump (fix->PATCH, feat->MINOR, feat!/BREAKING
#   CHANGE->MINOR while < 1.0 because major_on_zero = false; MAJOR only after 1.0.0), tags the
#   merge commit and publishes a GitHub Release with generated notes. It makes NO commit and
#   writes NO file: main is never pushed to by this workflow, so branch protection on main can
#   stay strict. The git tag is the SINGLE version source (hatch-vcs reads it at build time).
#   Non-releasing commits (docs/chore/refactor/test/ci/build/style) no-op cleanly: `released`
#   is "false" and every later job is skipped.
# build: the tag is checked out and built ONCE (sdist + wheel); `twine check --strict`,
#   `check-wheel-contents` and a smoke install of both files in clean environments must pass
#   before anything is uploaded. The same `dist` artifact is what both indexes receive.
# publish-*: Trusted Publishing (OIDC), no token or secret anywhere. TestPyPI first, then PyPI
#   behind the `pypi` environment (required reviewer). The publish jobs run no repository code.
#
# Rules kept on purpose: `permissions: {}` at the top and per job; `id-token: write` only in the two publish jobs, `contents: write` only
# in `release`; every action pinned by SHA; no caches; `persist-credentials: false` on every
# checkout; no `${{ }}` inside `run:` scripts (values go through `env:`).
#
# What is pinned and what is not. "Every action pinned by SHA" does not mean every layer is:
# - uv (setup-uv `version:`), twine and check-wheel-contents are exact; the build backend and
#   its build-time dependencies are exact in `[tool.uv] build-constraint-dependencies`
#   (pyproject.toml), without hashes.
# Residual risks, known and accepted:
# - The semantic-release action runs a Docker image built from `python:3.14-slim-trixie` (a tag,
#   no digest, apt/pip unpinned at build) from a Dockerfile inside the action's repository, so
#   a digest cannot be pinned from here. Its job holds `contents: write` only, and `build`
#   refuses a tag that is not on the commit that triggered the run.
# - The PyPA publish action, pinned by SHA, still runs a container image from
#   ghcr.io/pypa/gh-action-pypi-publish tagged with that SHA (a registry tag its maintainers
#   can move), built `FROM python:3.13-slim` (no digest). It runs in the jobs that hold
#   `id-token: write`; this is PyPA's supported path.
# - Approving `pypi` is a second look by the person who merged, not two-person control.
#
# Operating it (more in docs/contributing/development.md): a run that waits for the `pypi`
# approval holds the concurrency group below, so later pushes to main queue behind it. To retry
# after a failure use "Re-run failed jobs", never "Re-run all jobs" (PSR would find the tag
# already made, `released` would be "false" and nothing would publish). The `dist` artifact is
# kept 14 days; a failure before `build` is fixed forward with a new commit.

on:
  push:
    branches: [main]

# Nothing by default; every job asks for exactly what it needs.
permissions: {}

# Serialize releases on main so two pushes can't race to compute/push a tag.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag and create the GitHub Release
    outputs:
      released: ${{ steps.psr.outputs.released }}
      tag: ${{ steps.psr.outputs.tag }}
      version: ${{ steps.psr.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags so PSR can compute the bump
          persist-credentials: false # PSR pushes the tag to a URL that carries github_token

      - name: Release
        id: psr
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Tag-only: no release commit, no CHANGELOG.md. The tag is created on the
          # merge commit that is already on main and pushed with the token; the notes
          # are still generated and attached to the GitHub Release.
          commit: "false"
          changelog: "false"

  build:
    name: build
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      UV_NO_CACHE: "1" # nothing restored from or saved to a cache in a release job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit that triggered this run, not whatever the semantic-release output names:
          # the next step proves the tag is on it. Detached at the tagged commit with every tag
          # fetched, hatch-vcs reads exactly the tag's version.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag is this commit
        # The tag and version come from the semantic-release container: trust them only if the
        # tag has the release shape, matches the version and is on the commit being built.
        env:
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the release tag is not vX.Y.Z"; exit 1; }
          [ "$TAG" = "v$VERSION" ] || { echo "::error::tag $TAG does not match version $VERSION"; exit 1; }
          tagged="$(git rev-parse "refs/tags/$TAG^{commit}")"
          [ "$tagged" = "$GITHUB_SHA" ] || { echo "::error::tag $TAG is on $tagged, not on $GITHUB_SHA"; exit 1; }

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.8" # exact; keep equal to the dist-check job in ci.yml
          python-version: "3.14"
          enable-cache: false

      - name: Build the sdist and the wheel
        run: uv build

      - name: Check the metadata, the contents and a clean install
        # twine --strict, check-wheel-contents, then the wheel AND the sdist installed in clean
        # environments: `carter --version` must be the tag (hatch-vcs) and the bundled data must
        # come from the installed package. The same script runs on every PR (ci.yml: dist-check).
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: bash scripts/check-dist.sh "$VERSION"

      - name: Show the checksums
        run: |
          { echo '### dist (sha256)'; echo '```'; (cd dist && sha256sum -- *); echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-testpypi:
    name: publish-testpypi
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/carter-ai
    permissions:
      id-token: write # Trusted Publishing: the OIDC token is the only credential
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true # a re-run after a failed PyPI step must not fail here

  publish-pypi:
    name: publish-pypi
    needs: publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 15 # the work after the approval; the wait for the reviewer is not counted
    environment:
      name: pypi # required reviewer: the human approves each publication
      url: https://pypi.org/p/carter-ai
    permissions:
      id-token: write # Trusted Publishing: the OIDC token is the only credential
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # Attestations (PEP 740) stay at the action's default: on.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
