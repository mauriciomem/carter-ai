name: release

# Automated, tag-only SemVer release pipeline.
# On every push to main, python-semantic-release inspects the Conventional Commits
# since the last `vX.Y.Z` tag, derives the bump (fix→PATCH, feat→MINOR,
# feat!/BREAKING CHANGE→MINOR while < 1.0 because major_on_zero = false; MAJOR
# only after 1.0.0), tags the merge commit and publishes a GitHub Release with
# generated notes. It makes NO commit and writes NO file: main is never pushed to
# by this workflow, so branch protection on main can stay strict. The git tag is the
# SINGLE version source (hatch-vcs reads it at build time); no version literal is
# ever written to source, and the release notes live on the GitHub Release.
# Non-releasing commits (docs/chore/refactor/test/ci/build/style) no-op cleanly.

on:
  push:
    branches: [main]

# Least privilege: nothing by default. The release job alone gets `contents: write`
# (push the tag, create the GitHub Release). `id-token: write` is intentionally
# omitted — only needed for PyPI Trusted Publishing, which is out of scope here.
permissions:
  contents: read

# Serialize releases on main so two pushes can't race to compute/push a tag.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags so PSR can compute the bump

      - name: Release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Tag-only: no release commit, no CHANGELOG.md. The tag is created on the
          # merge commit that is already on main and pushed with the token; the notes
          # are still generated and attached to the GitHub Release.
          commit: "false"
          changelog: "false"
