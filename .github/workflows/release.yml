name: release

# Automated SemVer release pipeline (ADR-0009).
# On every push to main, python-semantic-release inspects the Conventional Commits
# since the last `vX.Y.Z` tag, derives the bump (fix→PATCH, feat→MINOR,
# feat!/BREAKING CHANGE→MAJOR), creates the tag, updates CHANGELOG.md, and publishes
# a GitHub Release with generated notes. The git tag is the SINGLE version source
# (hatch-vcs reads it at build time); no version literal is ever written to source.
# Non-releasing commits (docs/chore/refactor/test/ci/build/style) no-op cleanly.

on:
  push:
    branches: [main]

# Least privilege: PSR needs to push the release commit/tag and create the GitHub
# Release. `id-token: write` is intentionally omitted — only needed for PyPI Trusted
# Publishing, which is out of scope (this project installs via git+https@vX.Y.Z).
permissions:
  contents: write

# Serialize releases on main so two pushes can't race to compute/push a tag.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    # Skip the no-op self-trigger from PSR's own release commit.
    if: github.repository_owner != '' && !contains(github.event.head_commit.message, 'Automatically generated by python-semantic-release')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # full history + tags so PSR can compute the bump

      - name: Install uv (provides the `uv build` build_command)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@350c48fcb3ffcdfd2e0a235206bc2ecea6b69df0 # v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
