name: e2e

# The compatibility contract against a real OpenCode (mock model, isolated HOMEs; the signing
# scenarios included). It starts servers, so a human starts it: Actions → e2e → Run workflow.
# It never runs on a push or a pull request.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    # `tested` is the OpenCode version Carter is verified against (TESTED_OPENCODE); `latest` is
    # informational and allowed to fail.
    name: contract (opencode ${{ matrix.label }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        label: [tested, latest]
        include:
          - label: tested
            version: "2.1.4"
            experimental: false
          - label: latest
            version: latest
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Check the network namespace
        run: |
          if ! unshare -rn true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
          unshare -rn true || echo "::warning::no network namespace; the mock-provider-only guarantee still holds"

      - name: Check the OpenSSH tools
        run: ssh -V && command -v ssh-keygen ssh-agent ssh-add

      - name: Contract suite
        run: tests/e2e/run.sh --version "${{ matrix.version }}"

      - name: Check for stray ssh-agents
        if: always()
        run: |
          if pgrep -fl 'ssh-agent.*(c2b-|carter-e2e|\.carter/run)'; then
            echo "::error::an e2e scenario left an ssh-agent running"
            exit 1
          fi
