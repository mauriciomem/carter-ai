[project]
name = "carter-ai"
dynamic = ["version"]
description = "AI agent scaffolding and workspace management for OpenCode"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 SPDX expression (needs hatchling>=1.27, pinned in [build-system]). No
# `License ::` classifier: PEP 639 deprecates them alongside an SPDX expression.
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "mauriciomem" }]
keywords = ["opencode", "ai", "agents", "llm", "scaffolding", "cli", "devops"]
# "3 - Alpha": pre-1.0 (0.y.z, `major_on_zero = false`) - the CLI and config surface
# may still change in minor releases. Python versions span requires-python up to the
# CI matrix ceiling (3.11 / 3.14 / 3.15).
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/mauriciomem/carter-ai"
Repository = "https://github.com/mauriciomem/carter-ai"
Issues = "https://github.com/mauriciomem/carter-ai/issues"
Changelog = "https://github.com/mauriciomem/carter-ai/blob/main/CHANGELOG.md"

[project.scripts]
carter = "carter.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.17",
    "mypy>=2.3",
    "types-PyYAML",
    "httpx>=0.27",  # evals/test_live.py (live model calls)
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

# Tag-driven version: the latest vX.Y.Z git tag is the ONLY version
# source. No literal in source, no version-file written back. With no tag yet, the
# backend emits a PEP 440 dev version (e.g. 0.1.dev<N>+g<sha>) for any
# commit that is not exactly on a release tag.
[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Register the `live` marker here too: evals/pytest.ini registers it for
# `pytest evals/ ...` (that ini wins when evals/ is the only path), but a combined
# `pytest tests evals` run uses this config and would warn "unknown mark live".
markers = [
    "live: marks tests as requiring an API key for live model calls (deselect with '-m \"not live\"')",
    "e2e: starts a real OpenCode in an isolated HOME; opt-in with CARTER_E2E=1 (plan 004)",
    "gitold: the per-repo pre-push fallback; the CI git-old job runs these on a real git < 2.54",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["carter", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["carter"]

[tool.mypy]
python_version = "3.11"
packages = ["carter"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true

# Ratchet: small, already-clean modules held to extra strictness. Expand this list
# as more modules are typed; full-repo strict is a tracked follow-up, not an M1 gate.
# NB: enumerate explicit per-module flags — `strict = true` here leaks its checks
# (e.g. disallow_any_generics) globally in mypy, defeating the non-strict baseline.
[[tool.mypy.overrides]]
module = ["carter.resources", "carter.ops.attribution"]
disallow_any_generics = true
disallow_untyped_calls = true
warn_return_any = true
extra_checks = true

# python-semantic-release (PSR) — release automation.
# Verified against PSR 10.7.x (2026-10). The git tag is the SINGLE version source:
# PSR derives the current version from the latest `v{version}` tag
# and we set NEITHER `version_toml` NOR `version_variables`, so NO version file is
# written back. PSR's job here is purely to compute the bump, create the tag,
# update the CHANGELOG, and publish the GitHub Release.
[tool.semantic_release]
tag_format = "v{version}"
commit_parser = "conventional"
# No build in the release job: the PSR Action runs in its OWN Docker container (uv is
# not on its PATH → `uv build` exited 127), and we publish nothing from here — install
# is `git+https@vX.Y.Z`, and the wheel build is already verified by the `install-smoke`
# CI job. PSR only needs to tag, write the CHANGELOG, and cut the GitHub Release.
build_command = ""
# Stay pre-1.0: PSR's `allow_zero_version` defaults to FALSE,
# which would force-graduate the v0.1.0 baseline straight to 1.0.0. Keep 0.y.z, and
# with `major_on_zero = false` a breaking change bumps the MINOR (0.x → 0.x+1) instead
# of cutting 1.0.0 — 1.0.0 is a deliberate, manual stability declaration, not automatic.
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
# PSR renders changelog templates from `changelog.template_dir` (default "templates")
# IF that dir exists, else it uses the bundled default. The repo's `templates/` is
# Carter's scaffold dir (contains `{{ policy_frontmatter }}` etc.), which PSR must NOT
# treat as changelog templates — point template_dir at a dedicated, non-existent path
# so PSR falls back to its built-in CHANGELOG.md template.
template_dir = ".psr-templates"
default_templates = { changelog_file = "CHANGELOG.md" }
# Keep housekeeping out of the user-facing changelog (PSR v10 key; regexes matched
# against the commit message). Breaking variants (`chore!:`) are NOT excluded so they
# still surface. Release commits ("X.Y.Z / Automatically generated by
# python-semantic-release") are non-conventional and never rendered either way.
# https://python-semantic-release.readthedocs.io/en/stable/configuration/configuration.html#exclude-commit-patterns
exclude_commit_patterns = [
    '^(?:build|chore|ci|style|test)(?:\([^)]*\))?:',
]

# sdist: drop repo-only files (CI workflows, env sample). tests/ and evals/ stay
# (normal for sdists); skills/knowledge/mcp/templates stay so the wheel's
# force-include resolves when building from the sdist. `.gitignore` cannot be
# excluded: hatchling force-includes VCS exclusion files into every sdist so a
# rebuild from the sdist selects the same files (hatchling/builders/sdist.py).
[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/.env.example",
]

[tool.hatch.build.targets.wheel]
packages = ["carter"]

# Bundle static content into the wheel under carter/_data/ so the installed
# `carter` CLI can locate skills, templates, etc. without a repo
# checkout. carter/resources.py resolves this layout at runtime.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "carter/_data/skills"
"knowledge" = "carter/_data/knowledge"
"mcp" = "carter/_data/mcp"
"templates" = "carter/_data/templates"
