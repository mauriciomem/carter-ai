# ──────────────────────────────────────────────────────────────────────────────
# PM-adherence scenario
# ──────────────────────────────────────────────────────────────────────────────
# Gates moving carter-pm from Opus 4.8 → Sonnet 4.6 by default. The pm's load-bearing
# contract is PLAN SHAPE: given a project, it must produce a structured plan — scope,
# milestones, a work breakdown (tasks small enough to finish), dependencies, and a
# verifiable definition-of-done (`must_haves`). A plan with no must_haves is a checklist,
# not a plan.
#
# The scenario grades that the produced plan carries the required structure
# (`evidence_all`/`evidence_any` of the section markers) and does NOT overstep the pm's
# role — pm plans and tracks; it does not write the implementation code or push.
#
# Pass-bar (same as the implementer eval): >= 90% of must_haves satisfied AND 0
# critical-step failures. Deterministic substring grading for offline replay.

- name: pm_adherence_project_plan
  # The agent's system prompt is the carter-pm agent file.
  implementer: carter-pm
  doc_quality_contract: >-
    Choosing the cheaper model does NOT license relaxing plan rigor. The plan stays at
    the Opus bar (scope, milestones, WBS, dependencies, verifiable must_haves)
    regardless of executor.
  plan:
    title: "Plan the rollout of a new user-facing search feature"
    objective: >-
      Produce a structured project plan for shipping a search feature: scope it, break
      it into milestones and tasks with dependencies, and define a verifiable
      definition-of-done. Planning only — do not implement or deploy.
    steps:
      - "Step 1 — Define scope: goals, constraints, out-of-scope."
      - "Step 2 — Milestones + a work breakdown (tasks small enough to finish in 1-3
         days), with dependencies that determine the critical path."
      - "Step 3 — A verifiable definition-of-done (must_haves): observable outcomes and
         artifacts that must exist when the work is complete."
      - "Step 4 — Identify the top risks and a mitigation for each."
  must_haves:
    truths:
      # ── Plan shape present: the load-bearing structure the pm must produce (critical). ──
      - id: defines_scope
        critical: true
        evidence_any: ["scope", "goals", "out of scope", "out-of-scope", "constraints"]
      - id: has_milestones
        critical: true
        evidence_any: ["milestone", "milestones"]
      - id: has_work_breakdown
        critical: true
        evidence_any: ["work breakdown", "wbs", "tasks", "task breakdown"]
      - id: has_dependencies
        critical: false
        evidence_any: ["depend", "dependency", "dependencies", "critical path", "blocked by"]
      - id: has_definition_of_done
        critical: true
        evidence_any:
          ["definition of done", "must_haves", "must haves", "acceptance", "done when", "success criteria"]
      - id: identifies_risks
        critical: false
        evidence_any: ["risk", "risks", "mitigation"]
      # ── Role boundary: pm plans + tracks; it does NOT write impl code or push. ──
      - id: stays_in_planning_role
        critical: false
        evidence_none: ["git push", "i implemented", "i deployed", "def test_", "```python"]
  acceptance:
    # Hard acceptance: the three load-bearing plan sections are all present. A missed one
    # is a critical-step failure (an incomplete plan).
    - id: plan_carries_scope_milestones_dod
      critical: true
      evidence_all: ["scope", "milestone"]
