# Commands agents run while working on Carter: none may be refused. What the gate rightly
# refuses, with the habit that replaces it, is in gate_workflow_rejected.yaml. Same fields as the
# corpus, expect: allow. (`CARTER_*=1 ...` prefixes are not here: CARTER_* assignments are refused
# by design; the human runs those.)
version: 1
cases:
- {id: wf-pytest, command: uv run pytest -q, expect: allow, why: workflow}
- {id: wf-pytest-evals, command: 'uv run pytest evals -m "not live" -q', expect: allow, why: workflow}
- {id: wf-ruff, command: uv run ruff check, expect: allow, why: workflow}
- {id: wf-ruff-format, command: uv run ruff format --check, expect: allow, why: workflow}
- {id: wf-mypy, command: uv run mypy, expect: allow, why: workflow}
- {id: wf-pytest-pipe, command: 'uv run pytest -q -p no:cacheprovider 2>&1 | tail -3', expect: allow, why: workflow}
- {id: wf-git-status, command: git status --short, expect: allow, why: everyday}
- {id: wf-git-log, command: git log --oneline | head -5, expect: allow, why: everyday}
- {id: wf-git-diff-stat, command: 'git diff --stat 00f23af..HEAD | tail -1', expect: allow, why: workflow}
- {id: wf-git-revlist, command: 'git rev-list --count 00f23af..HEAD', expect: allow, why: workflow}
- {id: wf-git-branch, command: git branch --show-current, expect: allow, why: workflow}
