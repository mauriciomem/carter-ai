# Gate corpus (RFC-0007 C.4.3, plan 004 step 17). FROZEN: tests/gate/test_corpus_frozen.py pins its hash.
# Changing an expected result needs a reviewed change (update the hash in the same commit, say why).
# Fields: id, command, expect (allow|deny), rule (deny only), why, cwd?, setup?, residual?
# Placeholders: {tmp} = a fresh temporary directory. `~` and $HOME are the test's fixture home.
version: 1
cases:
- id: s3-01-dash-C
  command: git -C . push
  expect: deny
  rule: push-verbs
  why: global option -C before the verb
- id: s3-02-dash-c
  command: git -c a.b=c push
  expect: deny
  rule: push-verbs
  why: global option -c before the verb
- id: s3-03-no-pager
  command: git --no-pager push
  expect: deny
  rule: push-verbs
  why: global option --no-pager before the verb
- id: s3-04-env-prefix
  command: env GIT_X=1 git push
  expect: deny
  rule: push-verbs
  why: env wrapper
- id: s3-05-assign-prefix
  command: GIT_TRACE=0 git push
  expect: deny
  rule: push-verbs
  why: VAR= prefix
- id: s3-06-command
  command: command git push
  expect: deny
  rule: push-verbs
  why: command wrapper
- id: s3-07-abs-path
  command: /usr/bin/git push
  expect: deny
  rule: push-verbs
  why: absolute path to the binary
- id: s3-08-sh-c
  command: sh -c 'git push'
  expect: deny
  rule: push-verbs
  why: sh -c string is re-parsed
- id: s3-09-bash-lc
  command: bash -lc "git push"
  expect: deny
  rule: push-verbs
  why: bash -lc string is re-parsed
- id: s3-10-eval
  command: eval 'git push'
  expect: deny
  rule: push-verbs
  why: eval of a literal string
- id: s3-11-subst-command
  command: $(echo git) push
  expect: deny
  rule: dynamic-command
  why: command position is a substitution
- id: s3-12-var-subcommand
  command: x=push; git $x
  expect: deny
  rule: dynamic-command
  why: git subcommand from a variable
- id: s3-13-tab
  command: "git\tpush"
  expect: deny
  rule: push-verbs
  why: tab as the separator
- id: s3-14-xargs
  command: echo origin | xargs -I{} git push {}
  expect: deny
  rule: push-verbs
  why: xargs runs the command
- id: s3-15-alias-via-c
  command: git -c alias.pp=push pp
  expect: deny
  rule: config-flags
  why: -c alias.* is forbidden (and would resolve to push)
- id: s3-16-python-subprocess
  command: python3 -c "import subprocess; subprocess.run(['git', 'push'])"
  expect: deny
  rule: interpreter-git
  why: interpreter code that references git
- id: rfc-heredoc-shell
  command: |-
    bash <<EOF
    git push
    EOF
  expect: deny
  rule: push-verbs
  why: heredoc fed to a shell is re-parsed
- id: rfc-heredoc-quoted-shell
  command: |-
    bash <<'EOF'
    git push
    EOF
  expect: deny
  rule: push-verbs
  why: a quoted heredoc is still code when a shell reads it
- id: rfc-unquoted-heredoc-subst
  command: |-
    git commit -m "$(cat <<EOF
    $(git push)
    EOF
    )"
  expect: deny
  rule: push-verbs
  why: unquoted heredoc expands $(...) (rv2-eng S2)
