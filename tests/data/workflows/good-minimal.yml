# A tiny hand-written workflow that keeps every rule (no secrets, no write).
name: tiny
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tiny-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "no expressions in scripts"
